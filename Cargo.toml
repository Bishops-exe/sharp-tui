[package]
name = "sharp-tui"
version = "1.4.1"
edition = "2024"
description = "Ink but for rust!"
license = "LGPL-3.0-or-later"
repository = "https://github.com/bishops-exe/sharp-tui"
readme = "README.md"
homepage = "https://github.com/bishops-exe/sharp-tui#readme"

[features]
default = ["all"]
all = ["button", "input", "progress-bar", "scrolling", "spinner", "separator", "select"]
button = []
input = []
progress-bar = []
scrolling = []
spinner = []
separator = []
select = ["scrolling"]

# Recommended options!
#
# [profile.release]
# opt-level = "z"     # Optimize aggressively for binary size instead of speed
# lto = "fat"          # Enable Link-Time Optimization across all dependency crates
# codegen-units = 1   # Reduce parallel generation units to maximize LLVM optimizations
# panic = "abort"     # Remove stack unwinding code; panic immediately terminates
# strip = true        # Automatically strip all symbols and debuginfo from the output

[dependencies]
crossterm = "0.29.0"
yoga = "0.5.0"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "hooks", "signals"] }
textwrap = "0.16.2"
ordered-float = "4.6.0"
bidimap = "0.7.0"
dioxus-sdk-time = "0.7.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
